# Included from the server block and from every location that sets its own add_header
# (nginx does not inherit add_header into a location that defines one).
# No X-Frame-Options / frame-ancestors: Telegram Web embeds the Mini App in an iframe.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
